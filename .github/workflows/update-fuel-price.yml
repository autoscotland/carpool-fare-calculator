name: Update CPC fuel price

on:
  schedule:
    # Check every two hours. CPC usually changes prices weekly, but the
    # additional checks keep newly announced prices from waiting until evening.
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run fuel:update
      - name: Commit changed price
        run: |
          if git diff --quiet -- public/data/fuel-price.json; then
            echo "Fuel price unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/fuel-price.json
          git commit -m "Update CPC 95 fuel price"
          git push
